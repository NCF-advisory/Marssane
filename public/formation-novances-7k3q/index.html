:root {
--toile:#EEF1F3; --surface:#FFFFFF; --grid:#E4E8EC; --bord:#DDE2E8; --navbar:#DBE0E6; --repere:#C4CBD2;
--nav-off:#4B5562; --muted:#4B5562; --kick-card:#3A4350; --text-2:#3A4350; --body:#2B333D; --ink:#0E0E12; --slate:#5B6472;
--canard:#0E7291; --canard-f:#1B4B66; --teal:#089C8E; --turq:#00D1BE; --ecume:#C7F7EF; --ink-ecume:#0E5A3C;
--lav:#A88FEE; --peri:#C7D2F7; --clay:#C75A4D; --gris:#C4CBD2; --gris-g:#DFE4E9;
--dark:#0E0E12; --dark-line:#23262E; --dark-prog:#3C4654;
--sans:"Plus Jakarta Sans", Arial, sans-serif; --mono:"Spline Sans Mono", "Courier New", monospace;
--ease:cubic-bezier(.22,.68,.18,1); --pop:cubic-bezier(.34,1.56,.64,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0E0E12; }
body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
#deck { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: var(--toile); }
.noanim, .noanim *, .noanim::before, .noanim::after, .noanim *::before, .noanim *::after { transition: none !important; animation: none !important; }
.slide { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .5s var(--ease), visibility 0s linear .5s; }
.slide.active { opacity: 1; visibility: visible; transition: opacity .5s var(--ease), visibility 0s; }
.slide.cut, .slide.cut.active { transition: none; }
.light { background-color: var(--toile);
background-image: repeating-linear-gradient(to right, transparent 0, transparent 75.8px, var(--grid) 75.8px, var(--grid) 76.8px); }
.dark { background: var(--dark); color: #fff; --muted: #B4BCC6; --text-2: #C4CBD2; }
.abs { position: absolute; }
.parts { position: absolute; left: 132px; top: 76px; display: flex; gap: 15px; }
.part { width: 402px; font: 500 16px/1 var(--mono); letter-spacing: .15em; color: var(--nav-off); text-transform: uppercase; white-space: nowrap; }
.part.on { color: var(--muted); font-weight: 700; }
.part i { display: block; height: 5px; margin-top: 11px; background: var(--navbar); }
.part b { display: block; height: 100%; width: 0; background: var(--muted); transition: width .8s var(--ease); }
.kicker { position: absolute; left: 132px; top: 121px; font: 400 17px/1 var(--mono); letter-spacing: .2em; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
.title { position: absolute; left: 132px; top: 174px; margin: 0; font: 800 62px/1.08 var(--sans); letter-spacing: -.03em; color: var(--ink); white-space: nowrap; }
.pnum { position: absolute; left: 0; right: 0; top: 1022px; text-align: center; font: 400 15px/1 var(--mono); color: var(--muted); letter-spacing: .05em; }
.sig { position: absolute; right: 44px; top: 1018px; font: 400 20px/1 var(--mono); color: var(--muted); letter-spacing: .35em; white-space: nowrap; }
.sig b { font-weight: 500; color: var(--ink); letter-spacing: 0; }
.rep { position: absolute; font: 400 17px/1 var(--mono); color: var(--repere); }
.cornerlogo { position: absolute; left: 1790px; top: 55px; }
.logo { --s: 34px; --k: calc(var(--s) / 34); position: relative; display: inline-block; width: var(--s); height: var(--s); flex: none; }
.logo .eq { position: absolute; width: calc(7 * var(--k)); height: calc(7 * var(--k)); border: 0 solid var(--canard); }
.logo .tl { left: var(--k); top: var(--k); border-left-width: calc(2 * var(--k)); border-top-width: calc(2 * var(--k)); border-top-left-radius: calc(2 * var(--k)); }
.logo .bl { left: var(--k); bottom: var(--k); border-left-width: calc(2 * var(--k)); border-bottom-width: calc(2 * var(--k)); border-bottom-left-radius: calc(2 * var(--k)); }
.logo .br { right: var(--k); bottom: var(--k); border-right-width: calc(2 * var(--k)); border-bottom-width: calc(2 * var(--k)); border-bottom-right-radius: calc(2 * var(--k)); }
.logo .m { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -52%); font: 800 calc(20 * var(--k))/1 var(--sans); letter-spacing: -.02em; color: var(--ink); }
.logo .pl { position: absolute; right: 0; top: calc(-1 * var(--k)); font: 500 calc(10 * var(--k))/1 var(--sans); color: var(--turq); font-style: normal; }
.logo.neg .eq { border-color: #ECEEF1; }
.logo.neg .m { color: #FFFFFF; }
.fx { opacity: 0; transform: translateY(14px); transition: opacity .7s var(--ease), transform .7s var(--ease); }
.shown .fx { opacity: 1; transform: none; }
.popin { transform: scale(.6); opacity: 0; transition: transform .7s var(--pop), opacity .4s; }
.shown .popin { transform: none; opacity: 1; }
.pill { position: absolute; left: 0; right: 0; margin: 0 auto; width: max-content; top: 246px; padding: 17px 58px; border-radius: 40px; background: #fff;
box-shadow: 0 0 0 1.5px #fff, 0 0 0 2.4px #D8DBDF, 0 10px 24px -16px rgba(16,24,40,.25); font: 700 18px/1.2 var(--sans); color: var(--slate); white-space: nowrap; }
.covertitle { position: absolute; left: 0; right: 0; top: 588px; text-align: center; margin: 0; font: 800 96px/1 var(--sans); letter-spacing: -.035em; white-space: nowrap; }
.covertitle .x { color: var(--muted); font-size: 72px; margin: 0 34px; vertical-align: 6px; }
.covertitle .p { color: var(--canard); }
.coversub { position: absolute; left: 0; right: 0; top: 724px; text-align: center; font: 400 35px/1.3 var(--sans); color: var(--body); letter-spacing: -.01em; }
.coversub b { color: var(--canard); font-weight: 700; }
.coversig { position: absolute; left: 0; right: 0; top: 816px; text-align: center; font: 400 20px/1 var(--mono); color: var(--muted); letter-spacing: .35em; }
.coversig b { color: var(--turq); font-weight: 500; letter-spacing: 0; }
.wlab { position: absolute; left: 132px; top: 282px; font: 400 17px/1 var(--mono); letter-spacing: .2em; color: var(--muted); }
.waffle { position: absolute; left: 132px; top: 322px; width: 704px; display: grid; grid-template-columns: repeat(12, 50px); gap: 9.5px; }
.waffle i { width: 50px; height: 50px; border-radius: 6px; background: var(--gris-g); clip-path: inset(0 100% 0 0); transition: clip-path .32s cubic-bezier(.33,1,.68,1), background-color .4s; }
.shown .waffle i { clip-path: inset(0 0 0 0); }
.waxis { position: absolute; top: 924px; font: 400 15px/1 var(--mono); color: var(--muted); letter-spacing: .08em; }
.prog { position: absolute; left: 950px; top: 322px; width: 838px; }
.prow { position: relative; height: 149px; border-bottom: 1px solid #DDE2E8; }
.prow:last-child { border-bottom: 0; }
.prow .sw { position: absolute; left: 0; top: 22px; width: 35px; height: 35px; border-radius: 6px; }
.prow .no { position: absolute; left: 58px; top: 22px; font: 600 18px/1 var(--mono); color: var(--canard); }
.prow .t { position: absolute; left: 116px; top: 18px; font: 700 27px/1.15 var(--sans); letter-spacing: -.015em; color: var(--ink); }
.prow .s { position: absolute; left: 116px; top: 62px; width: 470px; font: 400 16px/1.35 var(--mono); color: var(--muted); }
.prow .mn { position: absolute; right: 0; top: 14px; width: 212px; padding: 12px 0; border-radius: 8px; background: var(--ecume); text-align: center; font: 500 19px/1 var(--mono); letter-spacing: .25em; color: var(--ink-ecume); }
.ptag { position: absolute; left: 132px; top: 92px; font: 400 21px/1 var(--mono); letter-spacing: .22em; color: var(--muted); }
.bignum { position: absolute; left: 124px; top: 196px; font: 700 139px/1 var(--mono); color: var(--turq); letter-spacing: -.02em; }
.ititle { position: absolute; left: 132px; top: 388px; margin: 0; font: 800 62px/1.08 var(--sans); letter-spacing: -.03em; color: #fff; white-space: nowrap; }
.ilist { position: absolute; left: 132px; top: 536px; width: 1078px; }
.ilist div { position: relative; height: 60px; border-bottom: 1px solid var(--dark-line); }
.ilist .n { position: absolute; left: 0; top: 18px; font: 600 19px/1 var(--mono); color: var(--turq); }
